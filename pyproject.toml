[project]
name = "company-report-kit"
version = "0.1.0"
description = "公司深度研究报告生成系统（覆盖上市与未上市）：澄清、计划、采集、证据、建模、分析、写作、质检、导出"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.120.2",
    "ddgs>=9.14.4",
    "langchain>=1.3.14",
    "langchain-anthropic>=1.5.3",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.2",
    "langchain-openai>=1.4.1",
    "langgraph>=1.2.10",
    "langgraph-cli[inmem]>=0.4.31",
    "langsmith>=0.3.37",
    "primp>=1.2.3",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "tavily-python>=0.7.26",
    "trafilatura>=2.2.0",
]

[project.optional-dependencies]
dev = ["mypy>=1.11.1", "ruff>=0.6.1", "pytest"]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# 默认 deselect network/live:日常只跑单元+组件(F/R/I)。
# 跑真实集成手动 opt-in:pytest -m live / pytest -m network / pytest -o addopts=""
addopts = "-m 'not network and not live'"
markers = [
    "network: 需网络访问(DDG/extract,无需 key)",
    "live: 需真实 API key(DeepSeek/Tavily)",
]

